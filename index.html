    // WGS-84 (GPS 標準) → GCJ-02 (中國「火星座標」) 轉換
    // 高德/騰訊地圖底圖都是 GCJ-02，直接用 GPS 座標標記會偏 100–300m
    const wgs84ToGcj02 = (lng, lat) => {
      if (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lng, lat];
      const a = 6378245.0, ee = 0.00669342162296594323;
      const x = lng - 105.0, y = lat - 35.0;
      let dLat = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
      dLat += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
      dLat += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
      dLat += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
      let dLng = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
      dLng += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
      dLng += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
      dLng += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
      const radLat = lat / 180 * Math.PI;
      const magic = 1 - ee * Math.sin(radLat) * Math.sin(radLat);
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return [lng + dLng, lat + dLat];
    };

    // 兩點直線距離（公里）
    const distKm = (a, b) => {
      const R = 6371, r = x => x * Math.PI / 180;
      const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
      const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
      return 2 * R * Math.asin(Math.sqrt(h));
    };

    function MapView({ days, locations }) {
      const mapRef = useRef(null);
      const mapInstance = useRef(null);
      const tileLayerRef = useRef(null);
      const layersRef = useRef([]);
      const [filter, setFilter] = useState("all");
      const [tileId, setTileId] = useState("amap");
      const tileSrc = TILE_SOURCES.find(t => t.id === tileId);

      const project = (lng, lat) => tileSrc.crs === "gcj02" ? wgs84ToGcj02(lng, lat) : [lng, lat];

      useEffect(() => {
        if (!mapRef.current || mapInstance.current) return;
        const map = L.map(mapRef.current, { center: [30.83, 103.85], zoom: 9, zoomControl: true, scrollWheelZoom: true });
        mapInstance.current = map;
      }, []);

      useEffect(() => {
        const map = mapInstance.current;
        if (!map) return;
        if (tileLayerRef.current) map.removeLayer(tileLayerRef.current);
        tileLayerRef.current = L.tileLayer(tileSrc.url, {
          attribution: tileSrc.attribution, subdomains: tileSrc.subdomains, maxZoom: 19,
        }).addTo(map);
      }, [tileId]);

      useEffect(() => {
        const map = mapInstance.current;
        if (!map) return;
        layersRef.current.forEach(l => map.removeLayer(l));
        layersRef.current = [];
        const visibleDays = filter === "all" ? days.map(d => d.day) : [filter];
        const allPts = [];
        visibleDays.forEach(dayNum => {
          const day = days.find(d => d.day === dayNum);
          const pts = locations.filter(l => l.day === dayNum);
          if (!day || pts.length === 0) return;
          const xy = pts.map(p => { const [lng, lat] = project(p.lng, p.lat); return { ...p, _lat:lat, _lng:lng }; });
          if (xy.length > 1) {
            const line = L.polyline(xy.map(p => [p._lat, p._lng]), { color: day.color, weight: 3, opacity: 0.6, dashArray: "6, 6" }).addTo(map);
            layersRef.current.push(line);
          }
          xy.forEach(pt => {
            const icon = L.divIcon({
              className: '',
              html: `<div class="day-marker" style="background:${day.color}">${day.weekday.charAt(1)}</div>`,
              iconSize: [30, 30], iconAnchor: [15, 15],
            });
            const marker = L.marker([pt._lat, pt._lng], { icon }).addTo(map);

    const parseStartMin = (timeStr) => {
      const m = String(timeStr).match(/(\d{1,2}):(\d{2})/);
      if (!m) return null;
      return parseInt(m[1])*60 + parseInt(m[2]);
    };
    const findActiveScheduleIdx = (schedule, nowMin) => {
      const times = schedule.map(s => parseStartMin(s.time));
      for (let i=0; i<times.length; i++) {
        if (times[i] !== null && times[i] > nowMin) return i;
      }
      return -1;
    };

              {isToday && upcomingIdx !== null && upcomingIdx >= 0 && (
                <div style={{ background:"#fff", border:`2px solid ${current.color}`, borderRadius:14, padding:"14px 16px", marginBottom:12 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                    <div style={{ background:current.color, color:"#fff", fontSize:11, fontWeight:700, padding:"3px 8px", borderRadius:12 }}>
                      ⏰ {String(Math.floor(nowMin/60)).padStart(2,'0')}:{String(nowMin%60).padStart(2,'0')}{sim && " 🧪"}
                    </div>
                    <div style={{ fontSize:12, color:"#888" }}>接下來：</div>
                  </div>
                  <div style={{ fontSize:17, fontWeight:700, color:current.color, marginBottom:4 }}>
                    {current.schedule[upcomingIdx].icon} {current.schedule[upcomingIdx].activity}
                  </div>
                  <div style={{ fontSize:12, color:"#999", marginBottom:6 }}>{current.schedule[upcomingIdx].time}</div>
                  <div style={{ fontSize:13, color:"#555", lineHeight:1.6 }}>{current.schedule[upcomingIdx].detail}</div>
                </div>
              )}
              {isToday && upcomingIdx === -1 && (
                <div style={{ background:"#f9f7f4", borderRadius:14, padding:"14px 16px", marginBottom:12, fontSize:13, color:"#888", textAlign:"center" }}>
                  🌙 今天的行程都結束了，好好休息～
                </div>
              )}
              <div style={{ background:current.color, borderRadius:14, padding:"18px 20px", color:"#fff", marginBottom:16 }}>
                <div style={{ fontSize:13, opacity:0.8, marginBottom:2 }}>{current.weekday} {current.date}{isToday && " ・ 今天"}</div>
                <h2 style={{ fontSize:22, fontWeight:700, margin:"4px 0" }}>{current.title}</h2>
                <div style={{ fontSize:14, opacity:0.85, marginTop:4 }}>{current.subtitle}</div>
                <div style={{ display:"flex", gap:16, marginTop:14, fontSize:12, opacity:0.85, flexWrap:"wrap" }}>
                  <div>🚌 {current.transport}</div><div>🏨 {current.hotel}</div>
                </div>
              </div>
              <div style={{ background:"#f9f7f4", borderRadius:10, padding:"10px 14px", marginBottom:16, fontSize:13, color:"#666", lineHeight:1.6 }}>🗺️ {current.transportDetail}</div>
              <div style={{ position:"relative", paddingLeft:24 }}>
                <div style={{ position:"absolute", left:7, top:8, bottom:8, width:2, background:"#e8e0d4" }}/>
                {current.schedule.map((s,i) => {
                  const isUpcoming = isToday && upcomingIdx === i;
                  const isPast = isToday && upcomingIdx !== null && (upcomingIdx === -1 || (parseStartMin(s.time) !== null && i < upcomingIdx));
                  return (
                    <div key={i} style={{ position:"relative", marginBottom:18, paddingLeft:20, opacity: isPast ? 0.4 : 1 }}>
                      <div style={{ position:"absolute", left:-20, top:4, width:16, height:16, borderRadius:"50%", background:isUpcoming ? "#fff" : current.color, border: isUpcoming ? `2px solid ${current.color}` : "none", display:"flex", alignItems:"center", justifyContent:"center", fontSize:8, color: isUpcoming ? current.color : "#fff", zIndex:1, boxShadow: isUpcoming ? `0 0 0 4px ${current.color}33` : "none" }}>{isUpcoming ? "▶" : "●"}</div>
                      <div style={{ fontSize:12, color: isUpcoming ? current.color : "#999", fontWeight: isUpcoming ? 700 : 500, marginBottom:2 }}>{s.time}{isPast && " ✓"}</div>
                      <div style={{ fontSize:15, fontWeight:600, marginBottom:3 }}>{s.icon} {s.activity}</div>
                      {s.detail && <div style={{ fontSize:13, color:"#666", lineHeight:1.6 }}>{s.detail}</div>}
                    </div>
                  );
                })}
              </div>
              <div style={{ background:"#fffbf0", border:"1px solid #f0e6cc", borderRadius:10, padding:"14px 16px", marginTop:8 }}>
                <div style={{ fontSize:13, fontWeight:600, color:"#b8860b", marginBottom:4 }}>💡 小提醒</div>
                <div style={{ fontSize:13, color:"#666", lineHeight:1.7 }}>{current.tips}</div>
              </div>
            </div>
          )}

          {/* 浮動測試按鈕：模擬旅遊中的不同時刻 */}
          <div style={{ position:"fixed", bottom:16, right:16, zIndex:9999 }}>
            {showSimMenu && (
              <div style={{ background:"#fff", borderRadius:12, padding:8, marginBottom:8, boxShadow:"0 4px 20px rgba(0,0,0,0.15)", border:"1px solid #e8e0d4", minWidth:180 }}>
                <div style={{ fontSize:11, color:"#888", padding:"6px 10px 4px" }}>🧪 預覽旅遊中時刻</div>
                {SIM_PRESETS.map((p, i) => {
                  const active = sim === null ? p.dayIdx === null : (sim.dayIdx === p.dayIdx && sim.min === p.min);
                  return (
                    <button key={i}
                      onClick={() => {
                        setSim(p.dayIdx === null ? null : { dayIdx:p.dayIdx, min:p.min });
                        if (p.dayIdx !== null) { setActiveDay(p.dayIdx); setView("day"); }
                        setShowSimMenu(false);
                      }}
                      style={{ display:"block", width:"100%", textAlign:"left", padding:"8px 10px", border:"none", borderRadius:6, cursor:"pointer", fontSize:12, fontFamily:"inherit",
                        background: active ? "#fff8e1" : "transparent", color: active ? "#b8860b" : "#444", fontWeight: active ? 700 : 500, marginBottom:2 }}>
                      {p.label}
                    </button>
                  );
                })}
                <div style={{ borderTop:"1px solid #e8e0d4", marginTop:4, padding:"8px 10px 4px" }}>
                  <div style={{ fontSize:11, color:"#888", marginBottom:4 }}>📅 出發日（只存在這支手機）</div>
                  <input type="date" value={toYmd(tripStart)} onChange={e => saveTripStart(e.target.value)}
                    style={{ width:"100%", boxSizing:"border-box", padding:"6px 8px", border:"1px solid #e8e0d4", borderRadius:6, fontSize:16, fontFamily:"inherit" }}/>
                </div>
              </div>
            )}
            <button onClick={() => setShowSimMenu(!showSimMenu)}
              style={{ background: sim ? "#b8860b" : "#1a1a1a", color:"#fff", border:"none", borderRadius:24, padding:"10px 16px", cursor:"pointer", fontSize:13, fontFamily:"inherit", fontWeight:600, boxShadow:"0 4px 14px rgba(0,0,0,0.2)" }}>
              {sim ? "🧪 模擬中" : "🧪 預覽"}
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

    // PWA service worker 註冊（離線可用）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
